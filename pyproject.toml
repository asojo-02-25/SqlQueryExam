[project]
name = "standard-sqlquery-exam"
version = "0.1.0"
description = "SQL Server DML exercises for programming beginners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymssql>=2.3.2",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqlquery_exam*"]

[tool.uv]
package = true
